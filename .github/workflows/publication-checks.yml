name: Publication integration checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    container: node:24-bookworm-slim
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: npm ci --no-audit --no-fund
      - run: node --check lib/publication-source.js
      - run: node --test scripts/python-publications.test.mjs
      - run: node scripts/sync-publication.test.mjs
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
